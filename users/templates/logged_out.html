{% extends "base.html" %}

{% block title %}Выход{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h1 class="h3 mb-3">Вы вышли из системы</h1>
                    <p class="text-muted mb-4">
                        Спасибо, что воспользовались нашим сайтом.
                    </p>
                    <div class="d-flex flex-column flex-sm-row gap-2">
                        <a href="{% url 'mailing:home' %}" class="btn btn-outline-secondary">
                            На главную
                        </a>
                        <a href="{% url 'users:login' %}" class="btn btn-primary">
                            Войти снова
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
