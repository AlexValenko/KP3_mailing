{% extends "base.html" %}

{% block title %}Удаление получателя{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">

        <div class="card shadow-sm border-0">

            <div class="card-body p-4">

                <h1 class="h3 mb-3">
                    Удаление получателя
                </h1>

                <p class="mb-4">
                    Вы действительно хотите удалить получателя
                    <strong>{{ object.full_name }}</strong>
                    (<strong>{{ object.email }}</strong>)?
                </p>

                <form method="post">
                    {% csrf_token %}

                    <div class="d-flex flex-column flex-sm-row gap-2">

                        <a
                                href="{% url 'mailing:home' %}"
                                class="btn btn-outline-secondary"
                        >
                            На главную
                        </a>

                        <a
                                href="{% url 'mailing:recipient_update' object.pk %}"
                                class="btn btn-outline-primary"
                        >
                            Отмена
                        </a>

                        <button
                                type="submit"
                                class="btn btn-danger"
                        >
                            Удалить
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>
</div>

{% endblock %}
