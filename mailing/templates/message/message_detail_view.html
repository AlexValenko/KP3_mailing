{% extends "base.html" %}

{% block title %}
Детали сообщения
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h1 class="h3 mb-4">
                    {% if object %}
                    Детали сообщения - {{message.subject}}
                    {% else %}
                    Нет данных
                    {% endif %}
                </h1>

                <p class="card-text">Сообщение:</p>
                <p class="card-text">{{message.body}} </p>

                <!-- Кнопки -->
                <div class="d-flex flex-column flex-sm-row gap-2">

                    <a
                            href="{% url 'mailing:message_list' %}"
                            class="btn btn-outline-secondary"
                    >
                        К списку
                    </a>
                    {% if object %}
                        <a
                                href="{% url 'mailing:message_update' object.pk %}"
                                class="btn btn-outline-primary"
                        >
                        Редактировать
                    </a>

                    <a
                            href="{% url 'mailing:message_delete' object.pk %}"
                            class="btn btn-outline-danger"
                    >
                        Удалить
                    </a>
                    {% endif %}

                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
